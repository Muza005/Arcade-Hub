<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070912" />
    <title>Arcade Hub</title>
    <style>
      /* Загрузка хаба (§15): логотип и тонкая полоса прогресса; дольше 3 с — подпись. Видна до загрузки кода. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #070912;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3.2vh;
        background: #070912;
        color: #f2f4fa;
        font-family: system-ui, sans-serif;
        transition: opacity 400ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #boot.boot--done {
        opacity: 0;
        pointer-events: none;
      }
      .boot__mark {
        width: 8vh;
        height: 8vh;
        box-sizing: border-box;
        border-radius: 2vh;
        border: 0.7vh solid #f2f4fa;
        box-shadow:
          inset 0 0 0 1vh #070912,
          inset 0 0 0 4vh #f2f4fa;
        transition: transform 600ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .boot__name {
        font-size: 4.4vh;
        font-weight: 800;
        letter-spacing: 0.02em;
        opacity: 0;
        transition: opacity 400ms;
      }
      .boot__bar {
        width: 24vh;
        height: 0.5vh;
        overflow: hidden;
        border-radius: 1vh;
        background: rgb(255 255 255 / 0.08);
      }
      .boot__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #3ddc97;
        animation: boot-bar 1.2s ease-in-out infinite;
      }
      @keyframes boot-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      .boot__caption {
        min-height: 1.4em;
        margin: 0;
        font-size: 2.2vh;
        color: #7a82a0;
      }
      /* Заставка при первом запуске (§5): крупный логотип и название. */
      #boot.boot--splash .boot__mark {
        transform: scale(1.6);
      }
      #boot.boot--splash .boot__name {
        opacity: 1;
      }
      #boot.boot--splash .boot__bar,
      #boot.boot--splash .boot__caption {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="boot" data-ru="Загружаем игры…" data-en="Loading games…">
      <div class="boot__mark"></div>
      <div class="boot__name">Arcade Hub</div>
      <div class="boot__bar"></div>
      <p class="boot__caption"></p>
    </div>
    <script>
      // Подпись о долгой загрузке — на языке из настроек хаба (строки — в data-атрибутах выше).
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (!boot || boot.classList.contains('boot--done')) return;
        var lang = 'ru';
        try {
          lang = JSON.parse(localStorage.getItem('arcade-hub:settings') || '{}').lang === 'en' ? 'en' : 'ru';
        } catch (e) {}
        boot.querySelector('.boot__caption').textContent = boot.getAttribute('data-' + lang);
      }, 3000);
    </script>
    <div id="hub"></div>
    <script type="module" src="/hub/main.ts"></script>
  </body>
</html>
